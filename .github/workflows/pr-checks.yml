name: PR Checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check_pr_title.py

  pr-body:
    name: PR body (issue ref / reviewer / hours / AI usage / tests / security / copyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pr_body.py
