name: Task
description: 一般的な作業タスク
title: "task: "
labels: ["type:task"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
  - type: textarea
    id: security
    attributes:
      label: Security Considerations
  - type: dropdown
    id: data_classification
    attributes:
      label: Data Classification
      options: ["Public", "Internal", "Confidential", "Restricted"]
      default: 1
    validations:
      required: true
  - type: input
    id: assignee
    attributes:
      label: Assignee
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
    validations:
      required: true
  - type: input
    id: planned_dates
    attributes:
      label: Planned Start / End Date
      placeholder: "2026-07-20 / 2026-07-25"
  - type: input
    id: estimated_hours
    attributes:
      label: Estimated Person-Hours
      placeholder: "2.0"
    validations:
      required: true
  - type: input
    id: actual_hours
    attributes:
      label: Actual Person-Hours
      placeholder: "TBD"
  - type: dropdown
    id: ai_usage_planned
    attributes:
      label: AI Usage Planned
      options: ["Yes", "No", "Undecided"]
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related Issues / Pull Requests
