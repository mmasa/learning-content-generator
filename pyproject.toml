[project]
name = "learning-content-generator"
version = "0.1.0"
description = "Common platform for generating learning content, structured data, quizzes, reading scripts, and audio materials from exams, standards, and internal training sources."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Masato Miyaichi" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[project.scripts]
lcg = "learning_content_generator.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "yamllint>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_content_generator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["learning_content_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
